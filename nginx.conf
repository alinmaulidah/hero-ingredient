# ============================================================
# Konfigurasi Nginx untuk situs statis Hero Ingredient
# Dipasang sebagai /etc/nginx/conf.d/default.conf di dalam image.
# ============================================================

server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Jangan bocorkan versi Nginx pada header respons.
  server_tokens off;

  charset utf-8;

  # Header keamanan dasar.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---------- Kompresi ----------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  # ---------- Health check ----------
  # Dipakai HEALTHCHECK Dockerfile & Coolify. Tanpa akses log.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---------- Aset ber-hash hasil build Astro ----------
  # Nama berkas di /_astro/ memuat hash konten, jadi aman di-cache lama.
  # Tanda ^~ memastikan blok ini menang atas aturan regex di bawah.
  location ^~ /_astro/ {
    expires 1y;
    try_files $uri =404;
  }

  # ---------- Aset dari folder public/ ----------
  # Nama berkasnya tidak ber-hash, jadi cache dibuat lebih pendek
  # supaya perubahan (mis. /styles/products.css) cepat terlihat.
  location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|eot)$ {
    expires 7d;
    try_files $uri =404;
  }

  # ---------- Halaman HTML ----------
  # Selalu divalidasi ulang agar rilis terbaru langsung tampil.
  location ~* \.html$ {
    expires -1;
  }

  # ---------- Routing ----------
  # Astro mem-build tiap halaman sebagai folder (format "directory"),
  # jadi /about dilayani dari /about/index.html.
  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
