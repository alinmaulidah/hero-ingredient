<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="100%" stop-color="#f8e9c9"/>
    </linearGradient>
    <radialGradient id="powder" cx="0.45" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#ffc300"/>
      <stop offset="70%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350f" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="120" fill="#f4d9a0" opacity="0.5"/>
  <circle cx="530" cy="390" r="140" fill="#f4d9a0" opacity="0.4"/>
  <!-- mangkuk -->
  <g filter="url(#shadow)">
    <path d="M150 210 Q170 150 220 135 L380 135 Q430 150 450 210 Q450 240 430 260 Q400 300 300 300 Q200 300 170 260 Q150 240 150 210Z" fill="url(#bowl)"/>
    <!-- bubuk -->
    <path d="M170 225 Q190 195 230 190 L370 190 Q410 195 430 225 Q410 210 300 210 Q190 210 170 225Z" fill="url(#powder)"/>
    <ellipse cx="300" cy="215" rx="125" ry="42" fill="url(#powder)"/>
    <path d="M185 210 Q240 235 300 232 Q370 228 415 205" stroke="#e65c00" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
  <!-- sendok -->
  <g transform="rotate(-24 470 190)">
    <ellipse cx="470" cy="150" rx="26" ry="34" fill="#d97706"/>
    <rect x="466" y="180" width="8" height="70" rx="4" fill="#92400e"/>
  </g>
  <text x="300" y="380" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e" letter-spacing="1">BUBUK KUNYIT</text>
  <text x="300" y="408" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" fill="#b45309" letter-spacing="0.5">Turmeric Dry Grind Fine</text>
</svg>
