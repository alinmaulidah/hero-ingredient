<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef7e8"/>
      <stop offset="100%" stop-color="#faeed2"/>
    </linearGradient>
    <radialGradient id="slice" cx="0.4" cy="0.35" r="1">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="55%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="slice2" cx="0.4" cy="0.35" r="1">
      <stop offset="0%" stop-color="#ffc93c"/>
      <stop offset="60%" stop-color="#fc9403"/>
      <stop offset="100%" stop-color="#ea6a00"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#92400e" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- lingkaran hias -->
  <circle cx="80" cy="70" r="130" fill="#fbdb9e" opacity="0.4"/>
  <circle cx="540" cy="400" r="150" fill="#fbdb9e" opacity="0.35"/>
  <!-- irisan kunyit -->
  <g filter="url(#shadow)">
    <ellipse cx="240" cy="210" rx="105" ry="80" fill="url(#slice)" transform="rotate(-12 240 210)"/>
    <ellipse cx="385" cy="240" rx="95" ry="72" fill="url(#slice2)" transform="rotate(10 385 240)"/>
  </g>
  <!-- tekstur irisan -->
  <g stroke="#e76f00" stroke-width="7" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M205 170 Q240 185 260 215"/>
    <path d="M250 190 Q290 200 315 235"/>
    <path d="M350 200 Q360 225 355 250"/>
    <path d="M415 215 Q430 240 425 275"/>
  </g>
  <text x="300" y="370" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#92400e" letter-spacing="1">KUNYIT KERING</text>
  <text x="300" y="398" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" fill="#b45309" letter-spacing="0.5">Turmeric Dry Slices</text>
</svg>
